name: CI Build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 14.x
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'zulu'
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.24
        cache-dependency-path: go/go.sum
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Test REST and SSE validator
      run: python3 -m unittest discover -s bin -p '*_test.py' -v
    - name: Install Oracle JET
      run: npm install -g @oracle/ojet-cli
    - name: Build Oracle JET front end
      run: |
        pushd java/helidon-server/src/main/web/jet
        npm install
        ojet build
        popd
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    - name: Build
      env:
        MAVEN_OPTS: -Dmaven.wagon.http.retryHandler.count=3
      run: mvn -B install --file java/pom.xml -s java/.mvn/settings.xml -P docker
    - name: Validate Micronaut Fat Jar
      run: |
        jars=(java/micronaut-server/target/*shaded.jar)
        test "${#jars[@]}" -eq 1
        bin/test-fat-jar.sh -d "${jars[0]}"
    - name: Validate Spring Fat Jar
      run: |
        jars=(java/spring-server/target/*.jar)
        test "${#jars[@]}" -eq 1
        bin/test-fat-jar.sh -d "${jars[0]}"
    - name: Validate Spring Fat Jar with native Coherence service
      env:
        JAVA_TOOL_OPTIONS: -Dspring.profiles.active=coherence
      run: |
        jars=(java/spring-server/target/*.jar)
        test "${#jars[@]}" -eq 1
        bin/test-fat-jar.sh -d "${jars[0]}"
    - name: Run Helidon Server
      run: |
        log="$RUNNER_TEMP/helidon-server.log"
        pushd java/helidon-server
        mvn exec:exec -s ../.mvn/settings.xml > "$log" 2>&1 &
        helidon_pid=$!
        popd
        for _attempt in {1..60}; do
          if ! kill -0 "$helidon_pid" 2>/dev/null; then
            echo "Helidon exited before gRPC and HTTP became ready" >&2
            cat "$log"
            exit 1
          fi
          if nc -z -w 1 127.0.0.1 1408 >/dev/null 2>&1 \
              && curl --fail --silent --connect-timeout 1 --max-time 2 \
                http://127.0.0.1:7001/api/tasks > /dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "Helidon gRPC and HTTP did not become ready" >&2
        cat "$log"
        exit 1
    - name: Validate Helidon REST and SSE
      run: python3 bin/test-rest-api.py http://127.0.0.1:7001 --graphql
    - name: Validate Node.js REST and SSE
      run: |
        pushd js
        npm install
        npm run start > "$RUNNER_TEMP/todo-js.log" 2>&1 &
        js_pid=$!
        popd
        for _attempt in {1..60}; do
          if ! kill -0 "$js_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/todo-js.log"
            exit 1
          fi
          if curl -fs http://127.0.0.1:7002/api/tasks > /dev/null; then
            python3 bin/test-rest-api.py http://127.0.0.1:7002
            exit 0
          fi
          sleep 1
        done
        cat "$RUNNER_TEMP/todo-js.log"
        exit 1
    - name: Validate Python REST and SSE
      run: |
        python3 -m pip install -r py/requirements.txt
        pushd py
        python3 app.py > "$RUNNER_TEMP/todo-py.log" 2>&1 &
        py_pid=$!
        popd
        for _attempt in {1..60}; do
          if ! kill -0 "$py_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/todo-py.log"
            exit 1
          fi
          if curl -fs http://127.0.0.1:7003/api/tasks > /dev/null; then
            python3 bin/test-rest-api.py http://127.0.0.1:7003
            exit 0
          fi
          sleep 1
        done
        cat "$RUNNER_TEMP/todo-py.log"
        exit 1
    - name: Validate JavaFX Helidon client gRPC API
      run: |
        mvn -B -f java/helidon-client/pom.xml -s java/.mvn/settings.xml -Dtodo.helidon.integration=true verify
    - name: Run Go Client
      env:
        COHERENCE_SERVER_ADDRESS: 127.0.0.1:1408
      run: |
        pushd go
        go test -v .
        popd
