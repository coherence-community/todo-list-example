apiVersion: coherence.oracle.com/v1
kind: Coherence
metadata:
  name: todo-list
spec:
  cluster: ToDo-Helidon
  replicas: 1
  image: ghcr.io/coherence-community/todo-list-helidon-server:26.10-SNAPSHOT
  # Create these namespace-local Secrets with bin/setup-helidon-health.sh first.
  healthMutatorConnection:
    secure: true
    basicAuth:
      username:
        name: todo-health-auth-v1
        key: username
      password:
        name: todo-health-auth-v1
        key: password
    tls:
      caSecret:
        name: todo-health-ca-v1
        key: ca.pem
      serverName: todo-health.local
    serverTLS:
      enabled: true
      requireClientCert: false
      secrets: todo-health-stores-v1
      keyStore: server.jks
      keyStorePasswordFile: store-password
      keyPasswordFile: store-password
      keyStoreType: JKS
    jaas:
      mode: packaged
  env:
    - name: OTEL_TRACES_EXPORTER
      value: "otlp"
    - name: OTEL_TRACES_SAMPLER
      value: "always_on"
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "grpc"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://jaeger-collector:4317"
  application:
    type: helidon
  coherence:
    metrics:
      enabled: true
#    persistence:
#      mode: active
#      persistentVolumeClaim:
#        storageClassName: "oci-bv"
#        accessModes:
#          - ReadWriteOnce
#        resources:
#          requests:
#            storage: 50Gi
  jvm:
    args:
      # Allow anonymous metrics scraping in this demo.
      - "-Dcoherence.metrics.http.auth=none"
    memory:
      heapSize: 1g
  ports:
    - name: grpc
      port: 1408
    - name: http
      port: 7001
      serviceMonitor:
        enabled: true
    - name: metrics
      serviceMonitor:
        enabled: true
