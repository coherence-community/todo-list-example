name: CI Build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  react-tests:
    name: React tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Match the Node.js version declared by the Java frontend POMs.
          - name: Helidon
            directory: java/helidon-server/src/main/web/react
            node-version: '14.21.3'
          - name: Micronaut
            directory: java/micronaut-server/src/main/web/react
            node-version: '14.21.3'
          - name: Spring
            directory: java/spring-server/src/main/web/react
            node-version: '14.21.3'
          # The JavaScript example requires Node.js 18.15+ and npm 9+.
          - name: JavaScript
            directory: js
            node-version: '26.12.0'
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install declared dependencies
      run: npm install --no-audit --no-fund
    - name: Run React tests
      run: CI=true npm test -- --watchAll=false --runInBand

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 14.x
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'zulu'
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go/go.mod
        cache-dependency-path: go/go.sum
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Test REST and SSE validator
      run: python3 -m unittest discover -s bin -p '*_test.py' -v
    - name: Install Oracle JET
      run: npm install -g @oracle/ojet-cli
    - name: Build Oracle JET front end
      run: |
        pushd java/helidon-server/src/main/web/jet
        npm install
        ojet build
        popd
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    - name: Build
      env:
        MAVEN_OPTS: -Dmaven.wagon.http.retryHandler.count=3
      run: mvn -B install --file java/pom.xml -s java/.mvn/settings.xml -P docker
    - name: Validate Micronaut Fat Jar
      run: |
        jars=(java/micronaut-server/target/*shaded.jar)
        test "${#jars[@]}" -eq 1
        bin/test-fat-jar.sh -d "${jars[0]}"
    - name: Validate Spring Fat Jar
      run: |
        jars=(java/spring-server/target/*.jar)
        test "${#jars[@]}" -eq 1
        bin/test-fat-jar.sh -d "${jars[0]}"
    - name: Validate Spring Fat Jar with native Coherence service
      env:
        JAVA_TOOL_OPTIONS: -Dspring.profiles.active=coherence
      run: |
        jars=(java/spring-server/target/*.jar)
        test "${#jars[@]}" -eq 1
        bin/test-fat-jar.sh -d "${jars[0]}"
    - name: Run Helidon Server
      run: |
        log="$RUNNER_TEMP/helidon-server.log"
        pushd java/helidon-server
        mvn exec:exec -s ../.mvn/settings.xml > "$log" 2>&1 &
        helidon_pid=$!
        popd
        for _attempt in {1..60}; do
          if ! kill -0 "$helidon_pid" 2>/dev/null; then
            echo "Helidon exited before gRPC and HTTP became ready" >&2
            cat "$log"
            exit 1
          fi
          if nc -z -w 1 127.0.0.1 1408 >/dev/null 2>&1 \
              && curl --fail --silent --connect-timeout 1 --max-time 2 \
                http://127.0.0.1:7001/api/tasks > /dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "Helidon gRPC and HTTP did not become ready" >&2
        cat "$log"
        exit 1
    - name: Validate Helidon REST and SSE
      run: python3 bin/test-rest-api.py http://127.0.0.1:7001 --graphql
    - name: Set up Node.js for live JavaScript validation
      uses: actions/setup-node@v4
      with:
        node-version: '26.12.0'
    - name: Install non-Java client dependencies
      run: |
        pushd js
        npm install
        popd
        python3 -m pip install -r py/requirements.txt
    - name: Validate non-Java clients against Helidon
      run: bin/test-non-java-clients.sh 127.0.0.1:1408
    - name: Validate JavaFX Helidon client gRPC API
      run: |
        mvn -B -f java/helidon-client/pom.xml -s java/.mvn/settings.xml -Dtodo.helidon.integration=true verify
    - name: Validate non-Java clients against standalone Coherence
      run: |
        version=$(mvn -q -f java/coherence-server/pom.xml -s java/.mvn/settings.xml \
          -Dstyle.color=never help:evaluate -Dexpression=project.version -DforceStdout)
        image="ghcr.io/coherence-community/todo-list-coherence-server:$version"
        # Use only the matching image built by this job.
        docker image inspect "$image" > /dev/null
        container=$(docker run --pull=never -d -p 127.0.0.1:1409:1408 \
          -e COHERENCE_CLUSTER=todo-standalone-ci "$image")
        # shellcheck disable=SC2329
        cleanup() {
          docker logs "$container" || true
          docker rm -f "$container" > /dev/null
        }
        trap cleanup EXIT
        for _attempt in {1..90}; do
          state=$(docker inspect --format '{{.State.Status}}' "$container")
          health=$(docker inspect --format '{{.State.Health.Status}}' "$container")
          if [ "$state" != running ] || [ "$health" = unhealthy ]; then
            echo "Standalone Coherence failed to start" >&2
            exit 1
          fi
          if [ "$health" = healthy ]; then
            bin/test-non-java-clients.sh 127.0.0.1:1409
            exit 0
          fi
          sleep 2
        done
        echo "Standalone Coherence did not become healthy" >&2
        exit 1
